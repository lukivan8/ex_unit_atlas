name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Elixir 1.14 / OTP 25
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.14.4"
          otp-version: "25"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: MIX_ENV=test mix compile --warnings-as-errors
      - name: Run test suite and generate Atlas report
        run: mix test
      - name: Verify generated Atlas report
        if: ${{ !cancelled() }}
        run: |
          test -s ex_unit_atlas_report/report.json
          test -s ex_unit_atlas_report/index.html
      - name: Upload Atlas report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ex-unit-atlas-report
          path: ex_unit_atlas_report/
          if-no-files-found: error
          retention-days: 14
      - name: Generate focused live example
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mix test test/dogfood_test.exs
      - name: Prepare live report for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ex_unit_atlas_report/
      - run: mix docs --warnings-as-errors
      - run: mix hex.build

  deploy-report:
    name: Deploy live Atlas report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
